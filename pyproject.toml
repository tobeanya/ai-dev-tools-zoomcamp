[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-tools-zoomcamp"
version = "0.1.0"
description = "AI Dev Tools Zoomcamp project"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DataTalksClub" }]
dependencies = ["django>=5.1,<6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9"]

[tool.setuptools]
packages = ["ai_dev_tools_zoomcamp"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ai_dev_tools_zoomcamp.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
